<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">Student learning on a laptop</title><desc id="desc">A modern dimensional illustration of a student studying at a laptop with books and learning symbols.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f5fc"/><stop offset="1" stop-color="#c8e2f2"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68b2db"/><stop offset="1" stop-color="#347ca8"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7b995"/><stop offset="1" stop-color="#ad8865"/></linearGradient>
 <linearGradient id="laptop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7899ad"/><stop offset="1" stop-color="#385d75"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4c7a0"/><stop offset="1" stop-color="#d99b72"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<rect x="22" y="18" width="596" height="524" rx="42" fill="url(#bg)"/>
<circle cx="498" cy="118" r="65" fill="#fff" opacity=".46"/><circle cx="116" cy="380" r="54" fill="#fff" opacity=".35"/>
<ellipse cx="322" cy="478" rx="220" ry="28" fill="#527d95" opacity=".18" filter="url(#shadow)"/>
<!-- floating learning shapes -->
<g opacity=".95"><rect x="75" y="115" width="82" height="72" rx="20" fill="#fff"/><path d="M98 151h36m-36 12h27" stroke="#68a9ce" stroke-width="7" stroke-linecap="round"/><path d="M116 128v12" stroke="#68a9ce" stroke-width="7" stroke-linecap="round"/>
<circle cx="526" cy="230" r="31" fill="#fff"/><path d="M512 230l10 10 19-23" fill="none" stroke="#69ad8c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M480 70l9 18 20 3-15 14 4 20-18-10-18 10 4-20-15-14 20-3z" fill="#f4c76f"/></g>
<!-- books -->
<g transform="translate(74 390)"><path d="M0 22l92-12 25 18-92 15z" fill="#6b9fbd"/><path d="M0 22v20l25 18V43z" fill="#4e7f9c"/><path d="M25 43l92-15v21L25 65z" fill="#8fc0d9"/><path d="M13 3l91-12 23 17-92 14z" fill="#e7b96f"/><path d="M13 3v19l22 16V19z" fill="#c58f4b"/><path d="M35 19l92-11v19L35 39z" fill="#f2d39b"/></g>
<!-- student body -->
<path d="M211 348c13-57 54-92 111-92 57 0 102 34 119 92l23 105H185z" fill="url(#shirt)"/>
<path d="M258 275c17 20 35 30 64 30 28 0 48-11 65-30l19 22-34 38h-99l-34-38z" fill="#2d6e98" opacity=".55"/>
<!-- neck and face -->
<path d="M291 244h52v55c-15 17-38 17-52 0z" fill="url(#skin)"/>
<ellipse cx="319" cy="190" rx="78" ry="91" fill="url(#skin)"/>
<!-- hair -->
<path d="M242 191c-12-62 24-111 79-111 57 0 86 42 78 105-9-22-25-35-43-42-24 17-61 22-97 13-3 18-9 30-17 35z" fill="#263d4b"/>
<path d="M252 161c7-46 39-71 75-71 31 0 54 15 68 42-32-14-66-9-91 8-18 12-35 20-52 21z" fill="#36566a"/>
<!-- face details -->
<ellipse cx="290" cy="196" rx="5" ry="7" fill="#344b59"/><ellipse cx="347" cy="196" rx="5" ry="7" fill="#344b59"/>
<path d="M304 228q15 12 30 0" fill="none" stroke="#a65f50" stroke-width="4" stroke-linecap="round"/>
<path d="M270 181q15-10 29-2m34 0q15-8 29 2" fill="none" stroke="#263d4b" stroke-width="5" stroke-linecap="round"/>
<!-- arms -->
<path d="M226 333c-22 18-38 41-43 72l59 13 36-64z" fill="url(#shirt)"/><path d="M409 334c23 17 38 42 44 72l-58 13-36-65z" fill="url(#shirt)"/>
<path d="M224 389c23 8 45 14 66 19l-8 22c-26-2-50-9-72-20z" fill="url(#skin)"/><path d="M410 389c-22 8-44 14-65 19l8 22c26-2 50-9 71-20z" fill="url(#skin)"/>
<!-- desk -->
<path d="M118 427l405-23 35 23-411 28z" fill="url(#desk)"/><path d="M147 451l18 5v54l-18-6zm374-21l17-4v49l-17 7z" fill="#9d7959"/>
<!-- laptop -->
<path d="M238 314q0-12 13-12h138q13 0 13 12v100H238z" fill="url(#laptop)" stroke="#35566c" stroke-width="5"/>
<rect x="250" y="313" width="140" height="88" rx="7" fill="#d8edf7"/>
<rect x="260" y="323" width="120" height="68" rx="4" fill="#f7fbfd"/>
<path d="M276 342h82M276 354h58M276 366h72" stroke="#91bad1" stroke-width="6" stroke-linecap="round"/>
<path d="M222 414h197l26 19q3 5-8 7H209q-10-2-5-8z" fill="#587d93"/><path d="M288 422h65" stroke="#b7d2df" stroke-width="4" stroke-linecap="round"/>
<!-- hands on keyboard -->
<path d="M276 405c-2 13 3 19 15 20l18-4-2-12-18-8zM358 405c3 13-3 19-15 20l-18-4 2-12 18-8z" fill="url(#skin)"/>
</svg>